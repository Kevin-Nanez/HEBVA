    respuesta: "Sí: 5 de 18 tickets de refrigeración tienen prioridad Baja, y 2 de esos reportan carnes que no enfrían.\n\nBúsqueda ampliada por tema en la mesa de servicio, del 10 de junio al 23 de agosto de 2026: 3 tickets de \"se fue la luz en refris\" con prioridad Baja (1055, 1120, 1169) y 2 de \"refrigerador de carnes no enfría\" con prioridad Baja (1133 en Lomas del Sur, 1220 en Anáhuac). El ticket 1265 (Cumbres, \"se fue la luz\") sigue En proceso con prioridad Media.\n\nCriterio propio: el riesgo de producto perecedero hace que una falla de frío no deba quedar en Baja. Ninguna política fija una matriz de prioridad para estos tickets; la única regla es que una planta de emergencia que no arranca se levanta con prioridad Crítica (MAN-OPS-007 §7.2, p. 5; FAQ-OPS-001 P11, p. 3).\n\nNota: ningún ticket contiene la palabra «refrigeración» exacta, por lo que la búsqueda se amplió al tema y puede incluir tickets de otro asunto; revisé los títulos, que son de refrigeración.\nNota: los títulos no dicen si la planta de emergencia arrancó, así que no puedo confirmar cuáles debieron ser Crítica; conviene revisar esos tickets uno por uno.\nFuente: tickets_mesa_servicio.csv (herramienta tickets; metrica: buscar; texto: refrigeración; ampliada: tema). Corte: 31 de agosto de 2026.\nFuente: MAN-OPS-007 §7, p. 5 (Protocolo ante fallas de energía); FAQ-OPS-001 P11, p. 3 (¿Qué hago si se va la luz y los refrigeradores dejan de funcionar?)."
    porque: "Nombra los 5 folios, pero dice que el criterio es propio y que ninguna política fija la prioridad; el criterio pide el de los documentos, y FAQ-OPS-001 P20 lo da."

