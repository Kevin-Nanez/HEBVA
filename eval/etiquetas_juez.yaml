    respuesta: "La rebaja depende de los días que le queden a la dona antes de su caducidad: 5 días 15 %, 4 días 25 %, 3 días 35 %, 2 días 50 % y 1 día 60 % (solo perecederos no lácteos). Cita: POL-OPS-014 §6, pp. 4-5.\n\nPara la dona glaseada, la escala aplica sobre el precio regular vigente y solo a producto próximo a vencer (PVC) marcado con etiqueta naranja en el módulo «Última oportunidad». No excluye panadería, así que aplica.\n\nNo pude consultar las ventas de naranja en Lomas del Sur: «naranja» coincide con tres productos. ¿Cuál quieres?\n- SKU-1037 Naranja kg\n- SKU-1079 Refresco sabor naranja 2 L\n- SKU-1082 Jugo de naranja 1 L\n\nNota: Para saber qué porcentaje corresponde, dime cuántos días le faltan a la dona para su caducidad.\nNota: El alcance de POL-OPS-014 incluye Valle Norte (formato supermercado).\nSin resultado de la consulta (herramienta ventas; periodo: julio; metrica: unidades; tiendas: Lomas del Sur; producto: naranja).\nFuente: POL-OPS-014 §6, pp. 4-5 (Rebajas escalonadas para producto próximo a vencer)."
    porque: "En esta parte el criterio pide 25 % con los días restantes; da la escala y pide los días, sin el porcentaje."

