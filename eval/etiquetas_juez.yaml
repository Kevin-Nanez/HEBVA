    etiqueta: reprueba
    respuesta: "Según la tabla de plazos, no procede la devolución: el plazo para perecederos es de 48 horas desde la compra.\n\nUn perecedero solo se devuelve por defecto de calidad, y \"caducidad vencida al momento de la compra\" es uno de ellos. Pero el plazo se cuenta desde la fecha del ticket, y con 5 días ya está vencido. Los fragmentos recuperados no traen excepción a ese plazo. Si el ticket es de hace 5 días, no lo cambies ni lo reembolses en mostrador; consulta a tu gerencia o a Servicio al Cliente antes de decidir.\n\nNota: Cita PRO-SAC-021 §3, tabla «Perecederos» (p. 2), y §3.1 (p. 2), que dice que la devolución de perecederos procede solo por defecto de calidad, no por cambio de opinión. Si el cliente trae evidencia fotográfica razonable y el ticket, el procedimiento prevé registrarla con la observación «Evidencia fotográfica» y pedirle que deseche el producto; esa vía aplica dentro del plazo.\n\nNota: La devolución sin ticket no aplica, porque sí trae ticket. Tampoco aplica la regla de 30 días de abarrotes, porque el yogur es lácteo perecedero.\n\nNota: Revisé la tabla de plazos de PRO-SAC-021 (versión 4.0). La FAQ-OPS-001 también trata este caso, pero no se recuperó su contenido, así que no lo cito.\nFuente: PRO-SAC-021 §3, pp. 2-3 (Plazos de devolución por tipo de producto)."
    porque: "Da las 48 horas y que ya pasaron, pero no nombra la FAQ ni dice cuál prevalece: cita solo el procedimiento."

