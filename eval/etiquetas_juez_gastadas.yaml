    aspecto: nombra_conflicto
    etiqueta: reprueba
    respuesta: "Regla: retira solo el refrigerado que pasó de 7 °C por más de dos horas; no todo.\n\nEn una falla de más de cuatro horas, el producto refrigerado que superó los 7 °C durante más de dos horas se retira de la venta y se registra en SIGMA como «Falla de cadena de frío», con el formato de temperaturas como evidencia. Como la cámara nunca pasó de 5 °C, su producto no entra en esa regla. Los muebles refrigerados abiertos solo conservan la temperatura dos horas con cortinas nocturnas, así que verifica con termómetro de punción los que estuvieron abiertos o sin cortinas.\n\nNota: no sé si la planta de emergencia arrancó ni si los muebles tuvieron cortinas; si no, ese dato cambia la respuesta. Si la cámara no recuperó la temperatura objetivo en 60 minutos al restablecerse la energía, levanta ticket a Mantenimiento.\nFuente: FAQ-OPS-001 P11, p. 3 (¿Qué hago si se va la luz y los refrigeradores dejan de funcionar?); MAN-OPS-007 §7, p. 5 (Protocolo ante fallas de energía)."
    porque: "Contesta que no todo y aplica la regla del manual, pero no nombra la diferencia con la FAQ ni dice cuál prevalece: cita las dos en el pie y elige en silencio."

  - id: J-27
