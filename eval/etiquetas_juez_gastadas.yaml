# Las 20 etiquetas de validación del primer intento de T5.13, gastadas: python -m eval.juez dio 17 de 20 en las dos corridas, 85.0 %,
# con el prompt que solo pedía el motivo antes del veredicto. El prompt se corrigió mirando los errores (J-16, J-17 y J-23), así que
# ya no validan. Las nuevas están en eval/etiquetas_juez.yaml. Lo que sigue es la cabecera y las etiquetas tal como estaban.
#
# De dónde salen las 20 de validación. Son respuestas reales de eval/reportes/2026-11-02-completo-39d2639.json, tal
# como el juez las recibió en esa corrida (juez._casos_del_prompt), con sus notas, sus pies y sus turnos anteriores. Reemplazan
# a las 20 escritas a mano el 2026-11-01, que midieron 156 caracteres de media contra 735 de las reales, dieron 20 de 20 y no
# predijeron el 84.9 % del juez en la corrida; siguen en el historial de git y quedaron gastadas al cambiar el juez.
#
# Cómo se eligieron. python -m eval.elegir_etiquetas reparte con la semilla 20261113 lo que adjudicó con confianza la revisión de esa
# corrida (eval/reportes/2026-11-02-completo-39d2639-revision.md), sin los casos dudosos, sin las preguntas del conjunto ajuste y
# sin los criterios que D33-A endureció, salvo PT-29 de la corrida 1 (J-26): reprueba con el criterio de antes y con el de hoy,
# porque no nombra la diferencia con la FAQ. La semilla es un número fijo que no se deriva de nada (ver el módulo). El juez de antes
# de T5.13 acertó 14 y falló 6: el campo juez_viejo lo dice, y tests/test_etiquetas_reales.py lo compara con el reporte.
#
# No las revisó una persona. Las etiquetó el asistente de código (Claude Opus 5.5) el 2026-11-02 con los criterios ya
# corregidos (eval/cambios_criterios.md), leyendo cada respuesta y antes de correr ningún juez con ellas, pero con la revisión
# de la corrida a la vista. El 2026-11-03 el usuario delegó la revisión en el orquestador del plan, también Claude Opus 5.5,
# que leyó las 20 antes de validar, con PT-08 ya en D5-A, y no cambió ninguna. Las más discutibles son J-12, porque la parte
# «Reprueba» de PT-05 no nombra el aviso que pide la primera parte, y J-15, porque decir «no está claro que cubra» se acerca a
# decir que no cubre. El juez, quien etiquetó y quien revisó son de la misma familia de modelos: este acuerdo no es independiente.
# La decisión sobre PT-04, PT-27 y PT-29 está en «Decisión sobre tres endurecimientos» de eval/cambios_criterios.md: revertir PT-29
# después cambia la huella de validación.
# Límites: en toda la corrida ninguna respuesta afirma una causa, así que no_afirma_causa solo se mide del lado que aprueba; y
# el criterio propio de un compuesto sigue sin etiqueta, porque estas son de partes y de turnos.

