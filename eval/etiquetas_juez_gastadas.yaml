    corrida: 2
    juez_viejo: fallo
    pregunta: DT-04.PT-24
    aspecto: abstencion
    etiqueta: aprueba
    respuesta: "No puedo darte la existencia de leche deslactosada en Cumbres del 15 de julio: el inventario es una sola foto al corte del 1 de septiembre de 2026 y no hay historial de fechas anteriores.\n\nAlternativa: puedo darte la existencia de leche deslactosada en Cumbres al corte del 1 de septiembre de 2026.\n\nNo tengo el contenido del PRO-LOG-003. Solo aparece citado en POL-OPS-014 §1.2 (p. 1) y en §9 (p. 6), donde se indica que el Jefe de Recepción rechaza producto con vida de anaquel insuficiente conforme a ese procedimiento.\n\nPara lácteos, POL-OPS-014 §5.2 (p. 3) fija que se retiran del anaquel dos días antes de la fecha de caducidad. Esta política aplica a Cumbres (T02, supermercado).\n\nNota: la búsqueda no encontró el texto del PRO-LOG-003, así que el criterio de rechazo en recepción debe confirmarse con el documento completo.\nSin resultado de la consulta (herramienta inventario; metrica: inventario_historico; tiendas: Cumbres; producto: leche deslactosada).\nSin resultado de la consulta (herramienta buscar_politicas; consulta: producto con vida de anaquel insuficiente; documento: PRO-LOG-003).\nFuente: POL-OPS-014 §9, p. 6 (Responsabilidades por rol); POL-OPS-014 §5, pp. 3-4 (Reglas de retiro de anaquel)."
    porque: "En esta parte dice que el inventario es una foto al corte, sin historial, y no da una cifra como la del 15 de julio. El juez viejo la reprobó."

  - id: J-28
    conjunto: validacion
    corrida: 2
    juez_viejo: acerto
    pregunta: PT-10
    aspecto: nombra_conflicto
    etiqueta: aprueba
    respuesta: "Sin rebaja: hoy es el día de retiro de la pechuga, según POL-OPS-014 §5.1 (p. 3) y §6.1 (p. 4).\n\nLa política retira los perecederos un día antes de la caducidad, así que el último día de venta fue ayer. Hoy se retira del anaquel y se registra en SIGMA con causa \"Caducidad\".\n\nLa consulta de lotes en Valle Norte no encontró lotes de pechuga de pollo con caducidad en la ventana de 1 día (0 lotes).\n\nNota: la escala de rebaja de 60 % a 1 día (POL-OPS-014 §6, p. 4) aplica solo a perecederos no lácteos, pero no dice si se puede rebajar el día del retiro. Ahí hay un choque entre esa fila y §5.1 y §6.1. Tomo §5.1 y §6.1 como prevalecientes porque son las reglas que dicen \"sin excepción\" y aplican a la fecha de retiro; es criterio propio, la política no lo define.\n\nNota: la búsqueda de lotes usó el SKU-1023 que asignó la herramienta a \"pechuga de pollo\". Si el lote está registrado con otro SKU, el resultado podría cambiar.\nFuente: POL-OPS-014 §6, pp. 4-5 (Rebajas escalonadas para producto próximo a vencer); POL-OPS-014 §5, pp. 3-4 (Reglas de retiro de anaquel).\nSin resultado de la consulta (herramienta caducidades; accion: rebajar; ventana_dias: 1; tiendas: T01; skus: SKU-1023). Corte: 1 de septiembre de 2026."
    porque: "Nombra §6 contra §5.1 y §6.1, dice que prevalece el retiro y aclara que es criterio propio. «Contesta 60 % sin señalar el choque» es lo que reprobaría, y no lo hace."

  - id: J-29
    conjunto: validacion
    corrida: 2
    juez_viejo: acerto
    pregunta: PT-18-2
    aspecto: no_afirma_causa
    etiqueta: aprueba
    respuesta: "Venta de Cumbres el 15 de agosto de 2026: $94,422.12 MXN.\nEs la venta neta del día, con devoluciones descontadas; ese día no hubo devoluciones.\nFue la cifra más alta de agosto en Cumbres: el día anterior vendió $73,076.02 y el siguiente $71,069.98.\nCon estas cifras no puedo explicar la causa, porque no tengo desglose por producto, canal ni promoción para ese día.\n\nNota: Cumbres se interpretó como la tienda T02, según el filtro de la consulta.\nFuente: ventas.csv (herramienta ventas; metrica: venta; tiendas: T02; desde: 2026-08-15; hasta: 2026-08-15; grano: dia). Corte: 31 de agosto de 2026.\nFuente: ventas.csv (herramienta ventas; metrica: venta; tiendas: T02; desde: 2026-08-01; hasta: 2026-08-31; grano: dia). Corte: 31 de agosto de 2026."
    respuestas_anteriores:
      - "Venta de Cumbres del 14 al 16 de julio de 2026: $71,730.82 MXN.\nEs la venta neta total de esos tres días, con devoluciones descontadas. Por día: $23,547.89 el 14, $23,933.03 el 15 y $24,249.90 el 16.\nLas devoluciones del periodo fueron 1 pieza por $28.00 MXN, el 16 de julio.\nCon estas cifras no veo una caída que explique \"tan poco\": los tres días están en un rango parejo. Para saber si fue poco frente a otras semanas, necesito comparar con otro periodo, y las herramientas no dan causas de las ventas.\n\nNota: Interpreté \"Cumbres\" como la tienda T02. Si Cumbres corresponde a otra tienda, dímelo y vuelvo a consultar.\nFuente: ventas.csv (herramienta ventas; metrica: venta; tiendas: T02; desde: 2026-07-14; hasta: 2026-07-16; grano: dia). Corte: 31 de agosto de 2026.\nFuente: ventas.csv (herramienta ventas; metrica: devoluciones; tiendas: T02; desde: 2026-07-14; hasta: 2026-07-16; grano: dia). Corte: 31 de agosto de 2026."
    porque: "Da 94,422.12 y dice que no puede explicar la causa con esas cifras: no afirma ninguna."

