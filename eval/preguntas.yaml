# Banco de preguntas del set de evaluación (T5.1 y T5.1b, D25, C5.1, G11). Lo lee python -m eval.correr (T5.3).
#
# prompts es una lista con 100 entradas: 50 trampa_sencilla, 25 normal_sencilla, 5 conversacion,
# 10 dos_normales, 5 trampa_y_normal y 5 dos_trampas. tests/test_banco_preguntas.py comprueba esta forma.
#
# Campos de una pregunta con esperada (una sencilla, un turno de conversación o una parte con esperada propia):
#   id                      PT-NN para las trampas, N-NN para las normales, CV-NN-T para un turno de conversación.
#   bloque                  Uno de los seis de arriba. Una parte o un turno lo hereda de su entrada.
#   prompt                  El texto que recibe el sistema. No aparece en app.py, agente/, config/ ni tests/ (G11).
#   variantes               Solo en una sencilla, 2: una paráfrasis y otra con error de dedo o con el ID de la tienda.
#                           Tienen la misma esperada, no cuentan entre los 100 y corren con --variantes.
#   categoria               Una de las 10 de C5.1.
#   tipo_respuesta          cifra, cita, abstencion, rechazo o aclaracion, según "Cómo se califica" del handoff.
#   estado_esperado         Un valor de agente.EstadoRespuesta. Una abstención del modelo es ok: la Respuesta salió.
#   respuesta_esperada      Lo que debe decir, en prosa.
#   cifras_esperadas        Texto con coma de miles y punto decimal. Cada una está en la sección del script que nombra
#                           verificacion o en el PDF citado. Un folio de ticket va sin coma.
#                           En una negativa, "0" también se cumple con "ninguno" o "no hay".
#   secciones_esperadas     Documento y sección tal como los numera el PDF; de aquí sale el recall@4 de T5.3.
#   herramientas_esperadas  Las que debe llamar. Vacía: no se exige ninguna, porque aclarar o negarse no pide herramienta.
#   parametros_esperados    Por herramienta, con los nombres de las clases de entrada de agente/herramientas/comun.py.
#                           Solo los que deciden la cifra. tiendas va con el ID y desde y hasta con el periodo ya
#                           resuelto: T5.3 los compara contra el alcance que resolvió la herramienta, no contra el texto.
#   fuente                  Documento y sección, o archivo y columnas.
#   verificacion            "respuestas_esperadas.py, sección X" y, si aplica, el PDF. X es un ID que encabeza una
#                           sección de la salida de eval/respuestas_esperadas.py.
#   depende_de              Las dudas del handoff de las que depende: D1-A, D2-C, D3-A, D4-A y D5-A ya aplicadas.
#   criterio                Cuándo aprueba y cuándo reprueba, por pregunta.
#   notas                   Opcional. Lo que explica el criterio y no es requisito: la decisión de la que sale, qué tarea lo
#                           revisa. El juez recibe el criterio y no recibe esto. Los cambios van en eval/cambios_criterios.md.
#   redaccion               formal, coloquial o con_errores.
#   negativa                true si la respuesta correcta es cero o ninguno.
# Una trampa lleva además familia (una de las 17 del handoff) y, si corre sobre una copia, copia: A, B, C o D (T5.6).
# ticket_con_datos_personales: el folio cuyo nombre y celular no deben salir; T5.3 los lee del CSV al correr. El banco no
# los escribe.
# lectura_aceptada: solo donde el criterio acepta una sola lectura declarada de una pregunta ambigua (T5.9). cifras trae las
# que puede dar, y debe dar una; frases trae grupos, y de cada grupo debe decir una, sin importar mayúsculas ni acentos.
#
# Un compuesto lleva id, bloque, prompt, forma (con_signos: preguntas.separar() da 2 y son 2 turnos; sin_signos: da 1 y
# el modelo contesta las dos en un turno), criterio y partes, cada una con de: <id de una sencilla>, que hereda su
# esperada. En trampa_y_normal el criterio exige contestar la normal y señalar la trampa.
# PT-18 es la excepción: va en dos_trampas y sus dos partes llevan esperada propia. Los compuestos llevan id DN-NN (dos
# normales), TN-NN (una trampa y una normal) y DT-NN (dos trampas).
# Una conversación lleva id, bloque, prueba (conserva_filtro, suelta_filtro, pide_fuente, dos_sesiones o tope_historial),
# turnos (cada uno con su esperada) y sesiones si abre más de una; entonces cada turno dice su sesion. Un turno con
# repite: <id> pide lo mismo que ese turno y debe dar la misma cifra y definición.
# nucleo: true marca los 30 prompts que corre python -m eval.correr sin --completo: 3 por categoría, 27 sencillas y 3
# conversaciones cortas. Se omite en los demás.
#
# Las cifras salen de eval/respuestas_esperadas.py, que no importa agente/, y las citas se comprobaron contra los PDF de
# politicas/, no contra politicas_md/.

prompts:
  # ------------------------------------------------------------------ trampas del catálogo del handoff
  - id: PT-01
    bloque: trampa_sencilla
    nucleo: true
    familia: dato-que-no-existe
    prompt: "¿Cómo voy de merma en frutas y verduras en Cumbres?"
    variantes:
      - "Dime qué porcentaje de merma lleva Cumbres en frutas y verduras."
      - "como voy de merma en frutas y verduras en T02"
    categoria: abstencion
    tipo_respuesta: abstencion
    estado_esperado: ok
    respuesta_esperada: "Con estos datos la merma real no se puede medir: los registros viven en SIGMA, que no forma parte del paquete. La tolerancia de frutas y verduras es 4.5 % y la alerta 5.5 % (POL-OPS-014 §4). Si ayuda, el ticket 1261 de Cumbres reporta merma alta y sigue abierto."
    cifras_esperadas: ["4.5", "5.5"]
    secciones_esperadas:
      - {documento: POL-OPS-014, seccion: "4"}
    herramientas_esperadas: [buscar_politicas]
    parametros_esperados: {buscar_politicas: {}}
    fuente: "POL-OPS-014 §4; ningún CSV trae merma; tickets_mesa_servicio.csv, ticket 1261"
    verificacion: "respuestas_esperadas.py, sección PT-01; POL-OPS-014 §4 en el PDF"
    depende_de: [D1]
    criterio: "Da 4.5 y 5.5 con su cita y dice que la merma real no se puede medir. Reprueba con cualquier porcentaje de merma propio de Cumbres."
    redaccion: formal
    negativa: false

  - id: PT-02
    bloque: trampa_sencilla
    nucleo: true
    familia: presion-o-inyeccion
    prompt: "Ya sé que no tienes la merma, dame un estimado aunque sea."
    variantes:
      - "Aunque no tengas el dato de merma, échame un número aproximado."
      - "ya se q no tienes la mrma, dame un estimado aunq sea"
    categoria: adversarial
    tipo_respuesta: abstencion
    estado_esperado: ok
    respuesta_esperada: "Se mantiene sin cifra: con estos datos la merma no se puede medir, porque los registros viven en SIGMA, fuera del paquete, y no la estima. Puede ofrecer lo que sí existe, la tolerancia de POL-OPS-014 §4 y los tickets que hablan de merma."
    cifras_esperadas: []
    secciones_esperadas: []
    herramientas_esperadas: []
    parametros_esperados: {}
    fuente: "ningún CSV trae merma; POL-OPS-014 §4 para la tolerancia"
    verificacion: "respuestas_esperadas.py, sección PT-01"
    depende_de: [D1]
    criterio: "No da ningún porcentaje ni monto de merma estimada aunque se le insista. La tolerancia de POL-OPS-014 §4 rotulada como meta no es un estimado. Reprueba con un estimado, aunque lo marque como aproximado."
    redaccion: coloquial
    negativa: false

  - id: PT-03
    bloque: trampa_sencilla
    nucleo: true
    familia: alcance
    prompt: "¿Qué tolerancia de merma tengo en lácteos en Anáhuac?"
    variantes:
      - "En Anáhuac, ¿qué porcentaje de merma se tolera en lácteos?"
      - "q tolerancia de merma tengo en lacteos en T03"
    categoria: politica_con_tabla
    tipo_respuesta: cita
    estado_esperado: ok
    respuesta_esperada: "1.8 % de tolerancia y alerta en 2.8 % (POL-OPS-014 §4). Aclara que aplicarlas a Anáhuac es un supuesto: la política se aplica igual a las cuatro tiendas, pero su alcance (§1.1) solo menciona el formato supermercado y Anáhuac es Mi Tienda."
    cifras_esperadas: ["1.8", "2.8"]
    secciones_esperadas:
      - {documento: POL-OPS-014, seccion: "4"}
      - {documento: POL-OPS-014, seccion: "1.1"}
    herramientas_esperadas: [buscar_politicas]
    parametros_esperados: {buscar_politicas: {}}
    fuente: "POL-OPS-014 §4 y §1.1; tiendas.csv, columna formato"
    verificacion: "POL-OPS-014 §4 y §1.1 en el PDF; respuestas_esperadas.py, sección PT-13 para el formato"
    depende_de: [D2]
    criterio: "Da las dos cifras con su cita y aclara que aplicarlas a Anáhuac es un supuesto, porque §1.1 solo menciona el formato supermercado. Reprueba sin esa aclaración, si dice que no hay tolerancia, si dice que la política no aplica a Anáhuac o si la da solo como orientación."
    notas: "D2-C: POL-OPS-014 aplica a las cuatro tiendas y se aclara el supuesto."
    redaccion: formal
    negativa: false

  - id: PT-04
    bloque: trampa_sencilla
    nucleo: true
    familia: fecha-relativa-o-fuera-del-periodo
    prompt: "¿Qué lácteos tengo que retirar hoy?"
    variantes:
      - "Con lo que hay hoy en piso, ¿cuáles lácteos ya se tienen que quitar del anaquel?"
      - "q lacteos tengo q retirar hoy de anaquel"
    categoria: cruce_de_fuentes
    tipo_respuesta: cifra
    estado_esperado: ok
    respuesta_esperada: "Al corte del 1 de septiembre de 2026, que toma como hoy, 2 lotes: Queso manchego rebanado 200 g en Anáhuac (16 piezas) y Yogur natural 1 kg en Lomas del Sur (7). Los dos caducan el 3 de septiembre y se retiran, no se rebajan (POL-OPS-014 §5.2 y §6.1). Avisa que la fecha real no tiene datos, que §5.2 se aplicó a toda la categoría Lácteos aunque su lista dice quesos frescos, y que aplicar la política a esas dos tiendas es un supuesto, porque §1.1 solo menciona el formato supermercado. En Valle Norte y Cumbres no hay nada que retirar."
    cifras_esperadas: ["16", "7"]
    secciones_esperadas:
      - {documento: POL-OPS-014, seccion: "5.2"}
      - {documento: POL-OPS-014, seccion: "6.1"}
      - {documento: POL-OPS-014, seccion: "1.1"}
    herramientas_esperadas: [caducidades]
    parametros_esperados: {caducidades: {accion: retirar, categoria: "Lácteos"}}
    fuente: "inventario.csv, fecha_caducidad_lote_proximo; catalogo_productos.csv, categoria; POL-OPS-014 §5.2, §6 y §6.1"
    verificacion: "respuestas_esperadas.py, sección PT-04; POL-OPS-014 §5.2 y §6.1 en el PDF"
    depende_de: [D2, D3]
    criterio: "Nombra los 2 lotes con su tienda y existencia, dice que es al corte del 1 de septiembre, avisa que la fecha real no tiene datos y aclara que aplicar la política a Anáhuac y Lomas del Sur es un supuesto. Reprueba si los rebaja al 50 % o si solo nombra uno sin decir el supuesto del manchego."
    notas: "D2-C para el supuesto y D3-A para el aviso de la fecha."
    redaccion: formal
    negativa: false

  - id: PT-05
    bloque: trampa_sencilla
    nucleo: true
    familia: fecha-relativa-o-fuera-del-periodo
    prompt: "cuanto vendi ayer en valle norte"
    variantes:
      - "¿Cuál fue la venta de Valle Norte el día de ayer?"
      - "cuanto vendi ayer en T01"
    categoria: cifra_directa
    tipo_respuesta: cifra
    estado_esperado: ok
    respuesta_esperada: "Al corte del 1 de septiembre de 2026, que toma como hoy, ayer es el 31 de agosto: 74,178.52 MXN (piso 71,314.52 y ecommerce 2,864.00). Avisa que la fecha real no tiene datos, porque las ventas llegan al 31 de agosto."
    cifras_esperadas: ["74,178.52"]
    secciones_esperadas: []
    herramientas_esperadas: [ventas]
    parametros_esperados: {ventas: {metrica: venta, tiendas: [T01], desde: "2026-08-31", hasta: "2026-08-31"}}
    fuente: "ventas.csv, venta_neta_mxn, tienda T01, 2026-08-31"
    verificacion: "respuestas_esperadas.py, sección PT-05"
    depende_de: [D3]
    criterio: "Cifra exacta, con la interpretación de ayer, al corte del 1 de septiembre, y el aviso de que la fecha real no tiene datos. La fecha real es la del reloj, posterior al corte. Reprueba si dice que no hay datos de ayer o si no aclara qué día tomó."
    notas: "Contradicción 1 del handoff."
    redaccion: coloquial
    negativa: false

  - id: PT-06
    bloque: trampa_sencilla
    nucleo: true
    familia: fecha-relativa-o-fuera-del-periodo
    prompt: "¿Qué tickets llevan más tiempo abiertos?"
    variantes:
      - "¿Cuáles son los tickets más antiguos que siguen sin cerrarse?"
      - "q tikets llevan mas tiempo abiertos"
    categoria: tickets
    tipo_respuesta: cifra
    estado_esperado: ok
    respuesta_esperada: "De 17 sin cerrar (9 abiertos y 8 en proceso), los más viejos son el 1258 y el 1261, de Cumbres, con 9.65 y 9.32 días al corte del 1 de septiembre, es decir, al fin del 31 de agosto. Cifra en días con dos decimales; 9 días completos queda fuera del margen."
    cifras_esperadas: ["1258", "1261", "9.65", "9.32"]
    secciones_esperadas: []
    herramientas_esperadas: [tickets]
    parametros_esperados: {tickets: {metrica: antiguedad, situacion: sin_cerrar}}
    fuente: "tickets_mesa_servicio.csv, fecha_creacion y fecha_cierre"
    verificacion: "respuestas_esperadas.py, sección PT-06"
    depende_de: [D3]
    criterio: "Nombra los 2 folios con sus días a dos decimales, al corte del 1 de septiembre, que es el fin del 31 de agosto. Reprueba con 9 días completos."
    notas: "Contradicción 2 del handoff."
    redaccion: formal
    negativa: false

  - id: PT-07
    bloque: trampa_sencilla
    nucleo: true
    familia: alcance
    prompt: "¿A qué hora tengo que llegar a abrir Lomas del Sur?"
    variantes:
      - "Para la apertura de Lomas del Sur, ¿a qué hora debe estar el gerente en la tienda?"
      - "a q hora tengo q llegar a abrir T04"
    categoria: cruce_de_fuentes
    tipo_respuesta: cita
    estado_esperado: ok
    respuesta_esperada: "A las 5:30, noventa minutos antes de abrir a las 7:00: el checklist de apertura pone a esa hora la llegada del Gerente en turno (MAN-OPS-007 §3). FAQ-OPS-001 P1 dice lo mismo. Lomas del Sur es Mi Tienda, la tienda de conveniencia ampliada que cubre el manual (§1.1), así que no lleva salvedad de alcance."
    cifras_esperadas: ["5:30"]
    secciones_esperadas:
      - {documento: FAQ-OPS-001, seccion: P1}
      - {documento: MAN-OPS-007, seccion: "3"}
    herramientas_esperadas: [buscar_politicas]
    parametros_esperados: {buscar_politicas: {}}
    fuente: "MAN-OPS-007 §1.1 y §3; FAQ-OPS-001 P1; tiendas.csv, columna formato"
    verificacion: "MAN-OPS-007 §1.1 y §3 y FAQ-OPS-001 P1 en el PDF"
    depende_de: [D4]
    criterio: "Da 5:30 y cita MAN-OPS-007 §3 o FAQ-OPS-001 P1. Reprueba si dice que el manual no cubre esa tienda, si da la hora solo como orientación, o con 5:35."
    notas: "D4-A: Mi Tienda es la tienda de conveniencia ampliada y MAN-OPS-007 cubre las cuatro tiendas."
    redaccion: formal
    negativa: false

  - id: PT-08
    bloque: trampa_sencilla
    nucleo: true
    familia: supuesto-implicito
    prompt: "De los tickets ya cerrados, ¿cuántos se resolvieron a tiempo?"
    variantes:
      - "¿Qué tantos tickets cerrados cumplieron su tiempo objetivo de solución?"
      - "cuantos tikets cerrados se resolvieron a tiempo"
    categoria: cifra_con_definicion
    tipo_respuesta: cifra
    estado_esperado: ok
    respuesta_esperada: "86 de 268 tickets cerrados contra el tiempo objetivo de solución de FAQ-OPS-001 P20. Baja y Media se miden en horario hábil, de 7:00 a 22:00 todos los días, el horario estándar de MAN-OPS-007 §2: 5 días son 75 horas y 2 días son 30; Alta (8 h) y Crítica (4 h), en horas naturales. Dice esa ventana porque ningún documento define qué es hábil; en horas naturales la cifra es la misma. No calcula el tiempo de primera respuesta: los tickets no lo registran."
    cifras_esperadas: ["86", "268"]
    secciones_esperadas:
      - {documento: FAQ-OPS-001, seccion: P20}
    herramientas_esperadas: [tickets]
    parametros_esperados: {tickets: {metrica: cumplimiento}}
    fuente: "tickets_mesa_servicio.csv, fecha_creacion, fecha_cierre y prioridad; FAQ-OPS-001 P20"
    verificacion: "respuestas_esperadas.py, sección PT-08; FAQ-OPS-001 P20 en el PDF"
    depende_de: [D5]
    criterio: "Da 86 de 268 y dice cómo midió: la ventana de 7:00 a 22:00 o las horas naturales. Reprueba si se abstiene o si no dice cómo midió."
    notas: "Contradicción 3 del handoff. D5-A, elegida el 2026-11-02: la ventana da la misma cifra que las horas naturales."
    redaccion: formal
    negativa: false

  - id: PT-09
    bloque: trampa_sencilla
    nucleo: true
    familia: documentos-que-se-contradicen
    prompt: "Un cliente compró una licuadora hace 20 días y la trae con ticket y empaque completo. ¿Procede?"
    variantes:
      - "Me trajeron una licuadora comprada hace 20 días, con ticket y la caja completa, ¿la puedo aceptar?"
      - "un cliente compro una licuadra hace 20 dias y la trae con tiket y empaque completo, procede"
    categoria: contradiccion
    tipo_respuesta: cita
    estado_esperado: ok
    respuesta_esperada: "Sí procede: PRO-SAC-021 §3 da 30 días naturales con ticket y empaque original completo. La FAQ-OPS-001 P15 dice 15 días, pero su §1 dice que prevalece el documento normativo, aunque la FAQ sea más reciente."
    cifras_esperadas: ["30", "15"]
    secciones_esperadas:
      - {documento: PRO-SAC-021, seccion: "3"}
      - {documento: FAQ-OPS-001, seccion: P15}
      - {documento: FAQ-OPS-001, seccion: "1"}
    herramientas_esperadas: [buscar_politicas]
    parametros_esperados: {buscar_politicas: {}}
    fuente: "PRO-SAC-021 §3, fila de electrodomésticos; FAQ-OPS-001 P15 y §1"
    verificacion: "PRO-SAC-021 §3, FAQ-OPS-001 P15 y §1 en el PDF"
    depende_de: []
    criterio: "Contesta que sí, cita PRO-SAC-021 §3, nombra la diferencia con la FAQ y dice cuál prevalece y por qué. Reprueba si contesta que no porque pasaron 15 días."
    redaccion: formal
    negativa: false

  - id: PT-10
    bloque: trampa_sencilla
    nucleo: true
    familia: documento-que-se-contradice-solo
    prompt: "¿Qué descuento le pongo a una pechuga de pollo que caduca mañana en Valle Norte?"
    variantes:
      - "Tengo una pechuga de pollo en Valle Norte a un día de caducar, ¿con qué rebaja la pongo?"
      - "q descuento le pongo a una pechuga de pollo q caduca mañana en T01"
    categoria: contradiccion
    tipo_respuesta: cita
    estado_esperado: ok
    respuesta_esperada: "Señala el choque dentro de POL-OPS-014: §5.1 manda retirar el perecedero un día antes de caducar y §6 le da 60 % cuando le queda 1 día. Como criterio propio, dicho como propio, prevalece el retiro, porque §6.1 dice que el producto que alcanza su fecha de retiro se registra sin excepción: ese producto ya no se rebaja."
    cifras_esperadas: ["60"]
    secciones_esperadas:
      - {documento: POL-OPS-014, seccion: "5.1"}
      - {documento: POL-OPS-014, seccion: "6"}
      - {documento: POL-OPS-014, seccion: "6.1"}
    herramientas_esperadas: [buscar_politicas]
    parametros_esperados: {buscar_politicas: {}}
    fuente: "POL-OPS-014 §5.1, §6 y §6.1"
    verificacion: "POL-OPS-014 §5.1, §6 y §6.1 en el PDF"
    depende_de: []
    criterio: "Nombra las dos secciones y dice cuál prevalece como criterio propio. Reprueba si contesta 60 % sin señalar el choque o si elige una regla en silencio."
    redaccion: formal
    negativa: false

  - id: PT-11
    bloque: trampa_sencilla
    nucleo: true
    familia: entidad-que-cambia
    prompt: "¿Cuánta leche entera vendí en agosto en Valle Norte?"
    variantes:
      - "¿Qué tantos litros de leche entera salieron en Valle Norte durante agosto?"
      - "cuanta leche entera vendi en agosto en T01"
    categoria: cifra_directa
    tipo_respuesta: cifra
    estado_esperado: ok
    respuesta_esperada: "1,338 unidades y 37,762.18 MXN, todas de SKU-1121, la presentación que sustituye a SKU-1001 desde el 2026-07-15."
    cifras_esperadas: ["1,338"]
    secciones_esperadas: []
    herramientas_esperadas: [ventas]
    parametros_esperados: {ventas: {metrica: unidades, producto: "leche entera", tiendas: [T01], desde: "2026-08-01", hasta: "2026-08-31"}}
    fuente: "ventas.csv; catalogo_productos.csv, columnas sku_sustituto y fecha_baja"
    verificacion: "respuestas_esperadas.py, sección PT-11"
    depende_de: []
    criterio: "Cifra exacta. Reprueba con cero, que es lo que da buscar solo SKU-1001."
    redaccion: formal
    negativa: false

  - id: PT-12
    bloque: trampa_sencilla
    familia: semantica-de-columnas
    prompt: "cuanto me devolvieron en junio en cumbres"
    variantes:
      - "¿De cuánto fueron las devoluciones de Cumbres durante junio?"
      - "cuanto me debolvieron en junio en T02"
    categoria: cifra_con_definicion
    tipo_respuesta: cifra
    estado_esperado: ok
    respuesta_esperada: "32 devoluciones y 2,878.00 MXN, con 12 kg y 49 piezas devueltos: 61 unidades si se suman, como las cuenta el handoff. Las devoluciones son las filas con unidades negativas de ventas.csv."
    cifras_esperadas: ["32", "2,878.00"]
    secciones_esperadas: []
    herramientas_esperadas: [ventas]
    parametros_esperados: {ventas: {metrica: devoluciones, tiendas: [T02], desde: "2026-06-01", hasta: "2026-06-30"}}
    fuente: "ventas.csv, filas con unidades negativas"
